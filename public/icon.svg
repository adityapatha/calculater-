<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f1f38"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.35"/>
  
  <!-- Banknote layer 1 (angled back) -->
  <g transform="rotate(-6 256 256)">
    <rect x="96" y="160" width="320" height="170" rx="20" fill="#047857" opacity="0.45"/>
  </g>
  
  <!-- Banknote layer 2 (angled slight) -->
  <g transform="rotate(4 256 256)">
    <rect x="96" y="150" width="320" height="170" rx="20" fill="#059669" opacity="0.6"/>
  </g>

  <!-- Main Front Banknote / Counter Device -->
  <rect x="96" y="140" width="320" height="180" rx="24" fill="url(#cardGrad)" filter="url(#glow)"/>
  <rect x="108" y="152" width="296" height="156" rx="18" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Denomination Watermark Oval -->
  <circle cx="256" cy="230" r="54" fill="#065f46" opacity="0.7"/>
  <circle cx="256" cy="230" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Currency Cash Symbol in Center -->
  <path d="M240 205 H272 M240 217 H272 M248 205 V255 M248 227 C264 227 268 217 268 217 M248 227 L268 255" 
        stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Calculator / Tally Pad Base below -->
  <rect x="116" y="325" width="280" height="110" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Mini LCD Screen -->
  <rect x="136" y="340" width="240" height="34" rx="8" fill="#061325" stroke="#10b981" stroke-width="2"/>
  <circle cx="152" cy="357" r="4" fill="#10b981"/>
  <text x="362" y="364" font-family="monospace, sans-serif" font-weight="bold" font-size="18" fill="#34d399" text-anchor="end">₹ 1,84,500</text>
  
  <!-- Mini Keys Grid -->
  <rect x="136" y="388" width="50" height="32" rx="6" fill="#334155"/>
  <text x="161" y="409" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f8fafc" text-anchor="middle">500</text>

  <rect x="198" y="388" width="50" height="32" rx="6" fill="#334155"/>
  <text x="223" y="409" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f8fafc" text-anchor="middle">200</text>

  <rect x="260" y="388" width="50" height="32" rx="6" fill="#334155"/>
  <text x="285" y="409" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f8fafc" text-anchor="middle">100</text>

  <rect x="322" y="388" width="54" height="32" rx="6" fill="url(#goldGrad)"/>
  <text x="349" y="410" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a" text-anchor="middle">=</text>

  <!-- Floating Coins -->
  <g transform="translate(370, 100)" filter="url(#glow)">
    <circle cx="28" cy="28" r="26" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3"/>
    <text x="28" y="36" font-family="sans-serif" font-weight="bold" font-size="22" fill="#78350f" text-anchor="middle">₹</text>
  </g>
</svg>
